<style>
:root{
  --bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#6b7785;--ac:#1f4e78;
  --ok:#1e8e3e;--bad:#c0392b;--bd:#d9dee4;--in:#fff9db;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b232c;--tx:#e8edf2;--mu:#98a4b1;--ac:#5aa0d8;--ok:#4cc26b;--bad:#ff7b6b;--bd:#2c3744;--in:#2a2a1a}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b232c;--tx:#e8edf2;--mu:#98a4b1;--ac:#5aa0d8;--ok:#4cc26b;--bad:#ff7b6b;--bd:#2c3744;--in:#2a2a1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;min-height:56px;background:var(--ac);color:#fff;font-weight:700}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--ac);z-index:11}
#st{font-size:12px;font-weight:400}
#lo{width:auto;margin:0;padding:6px 10px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
main{padding:12px;max-width:640px;margin:auto;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:16px}
h3{margin:10px 0 4px;font-size:14px;color:var(--mu)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input,select,button,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--itx,var(--tx))}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer;margin-top:8px}

.row{display:flex;gap:8px}
.row>*{flex:1}
.row .n{flex:0 0 78px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd)}
.kv b{font-variant-numeric:tabular-nums}
.big{font-size:22px;font-weight:700}
.mu{color:var(--mu);font-size:12px}
.bad{color:var(--bad)}
.ok{color:var(--ok)}
nav{position:fixed;top:0;bottom:0;left:0;width:230px;max-width:80%;z-index:20;background:var(--card);border-right:1px solid var(--bd);padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(-105%);transition:transform .2s}

#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}

#mb{width:auto;margin:0;padding:4px 12px;background:rgba(255,255,255,.2);font-size:20px}

.cl{cursor:pointer}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--bd);font-size:12px}
a{color:var(--ac)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl{background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column}

<script>
// ====================== UTILIDADES BÁSICAS ======================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

const S={p:{},d:{},c:{},s:{},cl:{},u:{},pu:{},h:{},cs:{},adj:{},ck:{},cfg:{efi:0,dvi:0,tk:0,cy:1}};
const cyf=o=>Object.values(o).filter(x=>(x.cy||1)===S.cfg.cy);

let db=null,tab='i',cart=[],inv=[],open=null,pend=false,tipo='Contado',cf=false;
let loggedIn=false;
let inited=false,unsubs=[];
let anularSel='Efectivo';
let closeDraft={ne:null,nd:null};

const TABS=[['i','Inicio'],['v','Vender'],['n','Ventas'],['f','Fiados'],['k','Clientes'],['s','Stock'],['q','Catálogo'],['c','Saldo y Movimientos'],['r','Ciclo'],['z','Configuración']];

// ====================== FIRESTORE HELPERS ======================
function save(coll,id,data,m){
  if(!db)return;
  db.collection(coll).doc(id).set(data,{merge:true})
    .catch(e=>flash('No se pudo guardar: '+(e.message||e.code)));
}
function add(coll,data){if(!db)return;db.collection(coll).add(data).catch(e=>flash('No se pudo guardar: '+(e.message||e.code)))}
function del(coll,id){if(db)db.collection(coll).doc(id).delete().catch(()=>{})}

// ====================== MENSAJES Y ESTADO ======================
function flash(t){const s=$('#st');if(s&&loggedIn)s.textContent=t;setTimeout(status,3500)}
function status(){
  const s=$('#st');if(!s)return;
  if(!loggedIn){s.style.display='none';return}
  s.style.display='inline';
  s.textContent=(navigator.onLine?'en línea':'sin conexión')+(pend?' · cambios pendientes':'');
}

// ====================== CÁLCULOS BÁSICOS ======================
function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function tot(it){return it.reduce((a,x)=>a+x.q*x.p,0)}
function cst(it){return it.reduce((a,x)=>a+x.q*x.c,0)}
function debe(d){return Math.max(0,d.total-(d.paid||0))}
function bal(m){return (m==='Efectivo'?S.cfg.efi:S.cfg.dvi)+cyf(S.c).filter(x=>x.method===m).reduce((a,x)=>a+(x.in||0)-(x.out||0),0)}
const gd=(d,p)=>{let g=0,r=p;d.items.forEach(i=>{const t=i.q*i.p,c=i.q*i.c,x=Math.min(t,Math.max(0,r));r-=x;g+=Math.max(0,Math.min(t-c,x-c))});return g};
function gan(){let g=0;Object.values(S.s).forEach(s=>g+=s.total-s.cost);ND().forEach(d=>g+=gd(d,d.paid||0)-gd(d,d.paid0||0));return g}
function gastos(){return cyf(S.c).filter(x=>x.concept==='Gasto'||x.concept==='Retiro personal').reduce((a,x)=>a+(x.out||0),0)}
function cash(concept,detail,method,inn,out){if(inn||out)add('cash',{ts:Date.now(),date:today(),cy:S.cfg.cy,concept,detail,method,in:inn||0,out:out||0})}
function nextTk(){const t=Math.max(S.cfg.tk||0,...Object.values(S.d).map(d=>d.ticket||0),...Object.values(S.s).map(d=>d.ticket||0))+1;save('config','main',{tk:t});return t}

// ====================== CLIENTES Y STOCK ======================
function upClient(name,phone){const k=Object.entries(S.cl).find(([i,c])=>c.name.toLowerCase()===name.toLowerCase());if(k){const c=k[1];c.veces=(c.veces||0)+1;save('clients',k[0],{phone:phone||c.phone||'',veces:c.veces})}else save('clients',nid(),{name,phone:phone||'',area:'',veces:1,pagos:0,dias:0})}
function cp(cl,d){const k=Object.entries(S.cl).find(([i,c])=>c.name.toLowerCase()===cl.toLowerCase());if(!k)return;const c=k[1],dias=Math.max(0,Math.round((Date.now()-new Date(d.date+'T00:00:00'))/864e5));c.pagos=(c.pagos||0)+1;c.dias=(c.dias||0)+dias;save('clients',k[0],{pagos:c.pagos,dias:c.dias})}
function setStock(id,v){S.p[id].stock=v;save('products',id,{stock:v})}
// ====================== 2 VENTAS ======================
function vender(){
  const g=id=>$(id).value;
  if(!cart.length)return flash('Agrega productos');
  const met=g('#met'),cli=g('#cli').trim(),ph=g('#ph').trim();
  if(tipo==='Fiado'&&!cli)return flash('Escribe el cliente');
  if(tipo==='Fiado'&&cli&&(vf.c2||'').trim().toLowerCase()===cli.toLowerCase())return flash('El otro cliente debe ser distinto');
  if(tipo==='Fiado'&&(vf.c2||'').trim()){const a1=+vf.pc||0;if(!(a1>0)||a1>=tot(cart))return flash('Escribe cuánto paga el primer cliente (menos que el total)')}
  for(const it of cart){const p=S.p[it.id];if(p.stock<it.q&&!confirm('Solo quedan '+p.stock+' de '+p.name+'. ¿Seguir?'))return}
  const items=cart.map(x=>({n:x.n,q:x.q,p:x.p,c:x.c})),T=tot(items),C=cst(items),tk=nextTk();
  cart.forEach(it=>setStock(it.id,S.p[it.id].stock-it.q));
  if(tipo==='Contado'){
    save('sales',nid(),{date:today(),client:cli||'Ocasional',items,total:T,cost:C,method:met,ticket:tk});
    cash('Venta contado',cli||'Ocasional',met,T,0);
    if(cli)addCl(cli,ph);
  }else{
    const c2=(vf.c2||'').trim(),pc=1-Math.min(T,Math.max(0,+vf.pc||0))/T,sc=k=>items.map(x=>({...x,p:x.p*k,c:x.c*k}));
    if(c2){
      const ab=Math.min(T*(1-pc),+g('#ab')||0),k2=Object.values(S.cl).find(c=>c.name.toLowerCase()===c2.toLowerCase());
      let p1=0,p2=0;
      if(vf.abwho==='1')p1=ab;
      else if(vf.abwho==='2')p2=ab;
      else{p1=ab/2;p2=ab/2}
      save('debts',nid(),{date:today(),client:cli,phone:ph,items:sc(1-pc),total:T*(1-pc),cost:C*(1-pc),paid:p1,ticket:tk,con:c2});
      save('debts',nid(),{date:today(),client:c2,phone:(k2&&k2.phone)||'',items:sc(pc),total:T*pc,cost:C*pc,paid:p2,ticket:tk,con:cli});
      if(ab)cash('Abono inicial de fiado',cli+' y '+c2,met,ab,0);
      upClient(cli,ph);upClient(c2,'');
    }else{
      const ab=Math.min(T,+g('#ab')||0);
      save('debts',nid(),{date:today(),client:cli,phone:ph,items,total:T,cost:C,paid:ab,ticket:tk});
      if(ab)cash('Abono inicial de fiado',cli,met,ab,0);
      upClient(cli,ph);
    }
  }
  cart=[];vf={cli:'',ph:'',met:'Efectivo',ab:'',abwho:'1'};flash('Venta registrada ✓');render();
}

// ====================== COBROS ======================
function pagar(cl,all){
  const met=$('#pm').value;let amt=all?Infinity:+$('#pa').value||0;if(!amt)return flash('Escribe el monto');
  const ds=Object.entries(S.d).filter(([i,d])=>d.client===cl&&debe(d)>0).sort((a,b)=>a[1].date<b[1].date?-1:1);let sum=0;
  for(const[i,d]of ds){if(amt<=0)break;const x=Math.min(amt,debe(d));d.paid=(d.paid||0)+x;save('debts',i,{paid:d.paid});amt-=x;sum+=x;if(debe(d)<=0)cp(cl,d)}
  cash(all?'Pago de fiado':'Abono de fiado',cl,met,sum,0);flash('Registrado '+$$(sum));render();
}

// ====================== COMPRAS / CONSUMO ======================
const fp=n=>Object.entries(S.p).find(([i,p])=>p.name.toLowerCase()===n.toLowerCase());
function addI(){
  const n=$('#cn').value.trim(),q=+$('#cq').value,v=+$('#cv').value,pr=+$('#cp').value;
  if(!n||!(q>0)||!(v>=0))return flash('Completa producto, cantidad y valor');
  if(!fp(n)&&!inv.some(x=>x.n.toLowerCase()===n.toLowerCase())&&!(pr>0))return flash('Producto nuevo: escribe el precio');
  if(inv.length>=10)return flash('Máximo 10 ítems por factura');
  inv.push({n,q,v,pr});render();
}
function comprar(){
  if(!inv.length)return flash('Agrega ítems a la factura');
  const T=inv.reduce((a,x)=>a+x.v,0);
  inv.forEach(x=>{const e=fp(x.n);
    if(e){const p=e[1],st=Math.max(0,p.stock);p.stock+=x.q;p.cost=Math.round((st*p.cost+x.v)/(st+x.q)*10000)/10000;if(x.pr>0)p.price=x.pr;p.lc=Math.round(x.v/x.q*100)/100;p.ld=today();save('products',e[0],{stock:p.stock,cost:p.cost,price:p.price,lc:p.lc,ld:p.ld})}
    else{const id=nid();S.p[id]={name:x.n,stock:x.q,cost:x.v/x.q,price:x.pr,lc:Math.round(x.v/x.q*100)/100,ld:today()};save('products',id,S.p[id])}});
  add('purchases',{ts:Date.now(),date:today(),cy:S.cfg.cy,total:T,items:inv.length,det:inv.map(x=>({n:x.n,q:x.q,v:x.v}))});
  const pm=$('#cpm').value;if(pm!=='No descontar')cash('Reinversion','Compra de mercancia ('+inv.length+' items)',pm,0,T);
  inv=[];flash('Compra registrada ✓');render();
}
function consumo(){
  const id=$('#us').value,q=+$('#uq').value,p=S.p[id];
  if(!p||!(q>0))return flash('Elige producto y cantidad');
  if(p.stock<q&&!confirm('Solo quedan '+p.stock+'. ¿Seguir?'))return;
  setStock(id,p.stock-q);add('uses',{ts:Date.now(),date:today(),cy:S.cfg.cy,name:p.name,q,cost:p.cost,price:p.price});flash('Consumo registrado ✓');render();
}

// ====================== MOVIMIENTOS DE CAJA ======================
function mov(){
  const t=$('#mt').value,m=$('#mm').value,a=+$('#ma').value,n=$('#mn').value.trim();if(!(a>0))return flash('Escribe el monto');
  if(t==='Ingreso extra')cash(t,n,m,a,0);
  else if(t==='Traslado'){const o=m==='Efectivo'?'Daviplata':'Efectivo';cash('Traslado','A '+o,m,0,a);cash('Traslado','Desde '+m,o,a,0)}
  else cash(t,n,m,0,a);
  flash('Movimiento registrado ✓');render();
}
function saldo(){save('config','main',{efi:+$('#se').value||0,dvi:+$('#sd').value||0});flash('Saldo guardado ✓')}

// ====================== RESPALDO CSV Y MENÚ ======================
function descargarArchivo(filename,content,mime){
  const blob=new Blob([content],{type:mime||'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function respaldo(){
  const rows=[['tipo','fecha','cliente','detalle','total','pagado']];
  Object.values(S.s).forEach(s=>rows.push(['venta',s.date,s.client,s.items.map(i=>i.q+'x'+i.n).join('; '),s.total,s.total]));
  Object.values(S.d).forEach(d=>rows.push(['fiado',d.date,d.client,d.items.map(i=>i.q+'x'+i.n).join('; '),d.total,d.paid||0]));
  Object.values(S.p).forEach(p=>rows.push(['producto','',p.name,'stock '+p.stock+' costo '+p.cost+' precio '+p.price,'','']));
  const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  descargarArchivo('respaldo-ventas-'+today()+'.csv',csv,'text/csv');
  flash('Respaldo descargado ✓');
}
function menu(o){const n=$('#nv'),v=o===undefined?!n.classList.contains('open'):o;n.classList.toggle('open',v);$('#ov').classList.toggle('open',v)}
function go(){if(eC){eC=null;applyTh()}menu(false);window.scrollTo(0,0);render()}
function addCl(name,phone){if(!name||Object.values(S.cl).some(c=>c.name.toLowerCase()===name.toLowerCase()))return;save('clients',nid(),{name,phone:phone||'',area:'',veces:0,pagos:0,dias:0})}

const WA='<svg width="18" height="18" viewBox="0 0 24 24" style="vertical-align:-4px"><path fill="#25D366" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
const PEN='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';

let ec=null;
let dc=null;
// ====================== 3 CLIENTES ======================
function saveCl(id){
  const old=S.cl[id].name,nn=$('#en').value.trim();
  if(!nn)return flash('El nombre no puede estar vacío');
  if(Object.entries(S.cl).some(([i,c])=>i!==id&&c.name.toLowerCase()===nn.toLowerCase()))return flash('Ya existe un cliente con ese nombre');
  save('clients',id,{name:nn,phone:$('#ep').value.trim(),area:$('#ea').value.trim()});
  if(nn!==old)[['debts',S.d],['sales',S.s],['hist',S.h]].forEach(([c,o])=>Object.entries(o).forEach(([i,d])=>{if((d.client||'')===old)save(c,i,{client:nn})}));
  ec=null;flash('Cliente actualizado ✓');render();
}

// ====================== WHATSAPP DE COBRO ======================
function waUrl(n){
  const ds=Object.values(S.d).filter(d=>d.client===n&&debe(d)>0).sort((a,b)=>a.date<b.date?-1:1),c=Object.values(S.cl).find(c=>c.name===n);
  let ph=String((c&&c.phone)||(ds[0]&&ds[0].phone)||'').replace(/\D/g,'');if(ph&&ph.length<=10)ph='57'+ph;
  let t=(TH.enc?TH.enc+'\n\n':'')+(TH.sal!==undefined?TH.sal:'Hola {nombre}, te recuerdo tu saldo pendiente:').replace(/\{nombre\}/g,n)+'\n';

// ====================== ANULAR VENTA ======================
function anular(k,i){
  if(av!==i){
    const el=$('#am');if(el)anularSel=el.value;
    av=i;return render();
  }
  av=null;
  const m=anularSel||'Efectivo';
  const s=(k==='s'?S.s:S.d)[i];
  if(!s)return;
  const pr=k==='d'&&s.con?Object.entries(S.d).find(([j,d])=>j!==i&&d.ticket===s.ticket&&d.client===s.con):null;
  s.items.forEach(it=>{const e=fp(it.n);if(e)setStock(e[0],e[1].stock+it.q)});
  if(pr)pr[1].items.forEach(it=>{const e=fp(it.n);if(e)setStock(e[0],e[1].stock+it.q)});
  const dev=k==='s'?s.total:(s.paid||0)+(pr?(pr[1].paid||0):0);
  if(dev>0)cash('Anulación de venta',(s.client||'Ocasional')+' #'+s.ticket,k==='s'?s.method:m,0,dev);
  add('adj',{ts:Date.now(),date:today(),cy:S.cfg.cy,name:'Anulación #'+s.ticket,q:0,reason:'Anulación',note:(s.client||'Ocasional')+' · '+$$(s.total)});
  if(pr)del('debts',pr[0]);
  del(k==='s'?'sales':'debts',i);
  flash('Venta anulada ✓');render();
}

// ====================== DEVOLVER UN PRODUCTO ======================
function devolver(k,i,j){
  const s=(k==='s'?S.s:S.d)[i];if(!s)return;if(s.con)return flash('En una cuenta compartida usa Anular venta completa');
  const it=s.items[j],q=Math.min(it.q,Math.max(0,+$('#rq').value||0)),vuelve=$('#rs').value==='1',m=$('#rm').value;
  if(!(q>0))return flash('Escribe la cantidad a devolver');
  const val=q*it.p,cst=q*it.c,items=s.items.map((x,n)=>n===j?{...x,q:x.q-q}:x).filter(x=>x.q>0);
  if(!items.length)return flash('Es toda la venta: usa Anular venta completa');
  const total=s.total-val,cost=Math.max(0,s.cost-cst);
  if(vuelve){const e=fp(it.n);if(e)setStock(e[0],e[1].stock+q)}
  if(k==='s'){save('sales',i,{items,total,cost});cash('Devolución',(s.client||'Ocasional')+' #'+s.ticket,s.method,0,val)}
  else{const paid=s.paid||0,dev=Math.max(0,paid-total);save('debts',i,{items,total,cost,paid:Math.min(paid,total)});if(dev>0)cash('Devolución',s.client+' #'+s.ticket,m,0,dev)}
  add('adj',{ts:Date.now(),date:today(),cy:S.cfg.cy,name:'Devolución #'+s.ticket+' · '+it.n,q:vuelve?q:0,reason:vuelve?'Devolución':'Devolución (no vuelve: vencido o dañado)',note:q+'× '+it.n+' · '+$$(val)});
  ri=null;flash('Devolución registrada ✓');render();
}

function saveReplace(coll,id,data){

  db.collection(coll).doc(id).set(data)

}

// ====================== TINTES DINÁMICOS ======================
function tint(r,o){if(['bg','card','tx'].some(k=>o[k])){r.style.setProperty('--in','color-mix(in srgb,var(--card) 88%,var(--tx) 12%)');r.style.setProperty('--bd','color-mix(in srgb,var(--card) 75%,var(--tx) 25%)');r.style.setProperty('--mu','color-mix(in srgb,var(--tx) 65%,var(--card) 35%)')}else['--in','--bd','--mu'].forEach(p=>r.style.removeProperty(p))}
function tint2(r,o){
  const s=(p,v)=>v?r.style.setProperty(p,v):r.style.removeProperty(p),c=['bg','card','tx'].some(k=>o[k]);
  s('--in',o.inbg||(c?'color-mix(in srgb,var(--card) 88%,var(--tx) 12%)':''));
  s('--bd',c?'color-mix(in srgb,var(--card) 75%,var(--tx) 25%)':'');
  s('--mu',c?'color-mix(in srgb,var(--tx) 65%,var(--card) 35%)':'');
  s('--itx',o.intx||'');
  const lg=$('#lg');if(lg){if(o.logo){lg.src=o.logo;lg.style.display='inline-block'}else lg.style.display='none'}
}

// ====================== LOGO / IMAGEN DE FONDO ======================
function logo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(im.width,im.height),mk=s=>{const c=document.createElement('canvas');c.width=c.height=s;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);return c.toDataURL('image/png')};let u=mk(240);if(u.length>180000)u=mk(160);DR.logo=u;applyX(DR);render()};im.src=r.result};r.readAsDataURL(f)}
function bgimg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=800;c.height=800;c.getContext('2d').drawImage(im,0,0,800,800);DR.bgimg=c.toDataURL('image/jpeg',0.7);applyX(DR);render()};im.src=r.result};r.readAsDataURL(f)}

function stRow(p){
  const i=Object.keys(S.p).find(k=>S.p[k]===p);
  if(eP===i)return `<div class=card style="background:var(--bg)"><label>Nombre</label><input id=pn value="${esc(p.name)}"><label>Precio de venta</label><input id=pv type=number value="${p.price}"><p class=mu>El costo (${$$(p.cost)}) solo cambia con las compras.</p><div class=row><button class=r onclick="saveP('${i}')">Guardar</button><button class=s onclick="eP=null;render()">Cancelar</button></div>${p.stock===0?`<button class=s style="${dpd===i?'background:var(--bad);color:#fff':''}" onclick="delP('${i}')">${dpd===i?'Toca de nuevo para eliminar':'Eliminar producto'}</button>`:'<p class=mu>Solo se puede eliminar con existencia 0.</p>'}</div>`;
  const lv=p.stock<=1?'background:rgba(220,53,69,.18);border-left:4px solid #dc3545;padding-left:8px;border-radius:6px':p.stock<5?'background:rgba(255,193,7,.25);border-left:4px solid #f0ad00;padding-left:8px;border-radius:6px':'',
    tg=p.stock<=1?' <span class=pill style="background:#dc3545;color:#fff">comprar unidades</span>':p.stock<5?' <span class=pill style="background:#f0ad00;color:#000">pocas unidades</span>':'';
  return `<div class=kv style="${lv}"><span>${esc(p.name)}${tg}<br><span class=mu>costo ${$$(p.cost)} · precio ${$$(p.price)}</span></span><span style="text-align:right"><b class="${p.stock<=1?'bad':''}">${p.stock}</b><br><a onclick="eP='${i}';render()" style="cursor:pointer;color:var(--ac)" title="Editar">${PEN}</a></span></div>`

function saveP(i){
  const p=S.p[i],nn=$('#pn').value.trim(),pr=+$('#pv').value,old=p.name;
  if(!nn||!(pr>0))return flash('Escribe nombre y precio');
  if(Object.entries(S.p).some(([k,q])=>k!==i&&q.name.toLowerCase()===nn.toLowerCase()))return flash('Ya existe un producto con ese nombre');
  save('products',i,{name:nn,price:pr});
  if(nn!==old){[['sales',S.s],['debts',S.d]].forEach(([c,o])=>Object.entries(o).forEach(([k,d])=>{if(d.items.some(x=>x.n===old))save(c,k,{items:d.items.map(x=>x.n===old?{...x,n:nn}:x)})}));Object.entries(S.u).forEach(([k,u])=>{if(u.name===old)save('uses',k,{name:nn})})}

function nextQ(){
  const ds=qDays();if(!ds.length)return null;const h=new Date();h.setHours(0,0,0,0);let best=null;
  for(let m=0;m<3;m++){const y=h.getFullYear(),mo=h.getMonth()+m,last=new Date(y,mo+1,0).getDate();ds.forEach(d=>{const t=new Date(y,mo,Math.min(d,last));if(t>=h&&(!best||t<best))best=t})}
  return best?{d:best,diff:Math.round((best-h)/864e5)}:null
}

let cu=false;
function undoBtn(){
  const l=Object.values(S.cs).sort((a,b)=>b.n-a.n)[0];
  return l?`<button class=s style="${cu?'background:var(--bad);color:#fff':''}" onclick="anularCierre()">${cu?'Toca de nuevo para deshacer':'Deshacer el cierre del ciclo '+l.n}</button><p class=mu>Solo se puede deshacer el último ciclo cerrado.</p>`:'<p class=mu>El último cierre no se puede deshacer (se hizo antes de esta función).</p>'
}

function anularCierre(){
  const last=Object.values(S.cs).sort((a,b)=>b.n-a.n)[0];
  if(!last)return flash('No hay ciclos cerrados');
  const sn=S.ck[String(last.n)];
  if(!sn)return flash('Este cierre no se puede deshacer');
  const nxt=last.n+1;
  const hayActividad=
    Object.values(S.s).length>0||
    Object.values(S.d).some(d=>d.date>(last.cierre||''))||
    Object.values(S.c).some(x=>(x.cy||1)===nxt)||
    Object.values(S.pu).some(x=>(x.cy||1)===nxt)||
    Object.values(S.u).some(x=>(x.cy||1)===nxt)||
    Object.values(S.adj).some(x=>(x.cy||1)===nxt);
  if(hayActividad)return flash('No puedes deshacer: ya hay actividad en el ciclo '+nxt);
  if(!cu){cu=true;return render()}
  cu=false;
  const n=last.n;
  Object.entries(sn.sales||{}).forEach(([i,d])=>save('sales',i,d));
  Object.entries(sn.debts||{}).forEach(([i,d])=>save('debts',i,d));
  Object.entries(sn.p0||{}).forEach(([i,v])=>{if(S.d[i])save('debts',i,{paid0:v})});
  (sn.hist||[]).forEach(id=>del('hist',id));
  if(sn.cyc)del('cycles',sn.cyc);
  [['cash',S.c],['purchases',S.pu],['uses',S.u],['adj',S.adj]].forEach(([c,o])=>Object.entries(o).forEach(([i,d])=>{if((d.cy||1)===nxt)save(c,i,{cy:n})}));
  del('closed',String(n));
  save('config','main',{cy:n,cd:sn.prev.cd,efi:sn.prev.efi,dvi:sn.prev.dvi});
  flash('Cierre del ciclo '+n+' deshecho ✓');render();
}

function cerrar(){
  if(!cf){
    cf=true;
    closeDraft.ne=($('#ne')||{}).value||null;
    closeDraft.nd=($('#nd')||{}).value||null;
    return render();
  }
  cf=false;
  const k=kp(),cy=S.cfg.cy,hoy=today();
  const ne=+($('#ne')?$('#ne').value:0)||0;
  const nd=+($('#nd')?$('#nd').value:0)||0;
  closeDraft={ne:null,nd:null};
  const g={};
  const snap={n:cy,sales:{},debts:{},p0:{},hist:[],cyc:'',prev:{cd:S.cfg.cd||'',efi:S.cfg.efi||0,dvi:S.cfg.dvi||0}};
  const put=(cl,it,t,c,ds,tk)=>{const x=g[cl]=g[cl]||{cycle:cy,client:cl,ventas:0,uds:0,total:0,costo:0,desde:ds,hasta:ds,t:{}};x.uds+=it.reduce((a,i)=>a+i.q,0);x.total+=t;x.costo+=c;if(ds<x.desde)x.desde=ds;if(ds>x.hasta)x.hasta=ds;if(!x.t[tk]){x.t[tk]=1;x.ventas++}};
  Object.entries(S.s).forEach(([i,s])=>{snap.sales[i]=s;put(s.client||'Ocasional',s.items,s.total,s.cost,s.date,s.ticket);del('sales',i)});
  Object.entries(S.d).forEach(([i,d])=>{if(debe(d)<=0){snap.debts[i]=d;if(!d.money)put(d.client,d.items,d.total,d.cost,d.date,d.ticket);del('debts',i)}else{snap.p0[i]=d.paid0||0;save('debts',i,{paid0:d.paid||0})}});
  Object.values(g).forEach(x=>{delete x.t;x.ganancia=x.total-x.costo;const hid=nid();snap.hist.push(hid);save('hist',hid,x)});
  snap.cyc=nid();save('cycles',snap.cyc,{n:cy,desde:S.cfg.cd||'',cierre:hoy,vendido:k.vend,cobrado:k.cob,ganancia:k.gan,gcob:k.gcob,compras:k.comp,consumo:k.cons});
  if(JSON.stringify(snap).length<230000)save('closed',String(cy),snap);
  save('config','main',{cy:cy+1,cd:hoy,efi:ne,dvi:nd});flash('Ciclo '+cy+' cerrado ✓');tab='r';render();
}

  <div class=row>
    <input id=busqCInput value="${esc(busqC)}" placeholder="Nombre..." list=clsC>

    <button class=s style="flex:0 0 80px" onclick="busqC='';render()">Limpiar</button>

  <p class=mu>Se crean solos al registrar un fiado. Aquí completas el área y corriges el teléfono.</p></div>`+L.map(c=>`<div class=card><div class=kv style="border:0;padding:0"><span><b>${esc(c.name)}</b> <span class="pill ${c.db>0?'bad':''}">debe ${$$(c.db)}</span></span><a onclick="ec='${c.i}';render()" style="cursor:pointer;color:var(--ac)" title="Editar">${PEN}</a></div>
${ec===c.i?`<label>Nombre</label><input id=en value="${esc(c.name)}"><div class=row><div><label>WhatsApp</label><input id=ep value="${esc(c.phone)}" inputmode=tel></div><div><label>Área / departamento</label><input id=ea value="${esc(c.area)}"></div></div><div class=row><button class=r onclick="saveCl('${c.i}')">Guardar</button><button class=s onclick="ec=null;render()">Cancelar</button></div>${c.db>0?'<p class=mu>No se puede eliminar: tiene '+$$(c.db)+' pendientes.</p>':`<button class=s style="${dc===c.i?'background:var(--bad);color:#fff':''}" onclick="delCl('${c.i}')">${dc===c.i?'Toca de nuevo para eliminar':'Eliminar cliente'}</button>`}`:`<div style="margin-top:6px"><span class=mu>WhatsApp</span> ${esc(c.phone)||'—'}</div><div><span class=mu>Área</span> ${esc(c.area)||'—'}</div>`}
<div class=mu>Fiado ${c.veces||0} veces · ${c.pagos?'tarda '+Math.round(c.dias/c.pagos*10)/10+' días en pagar en promedio ('+c.pagos+' pagos)':'aún sin pagos completos'}</div></div>`).join('')
}

// ====================== VISTA: CICLO ======================
function vR(){
  const k=kp(),cy=S.cfg.cy,cs=Object.values(S.cs).sort((a,b)=>b.n-a.n);
  const kv=(l,v,c)=>`<div class=kv><span>${l}</span><b class="${c||''}">${v}</b></div>`;
  const neVal=cf&&closeDraft.ne!==null?closeDraft.ne:Math.round(bal('Efectivo'));

<h3>Compras vs ventas</h3>${kv('Invertido en compras del ciclo',$$(k.comp))}${kv('Consumo personal (a costo)',$$(k.cons))}</div>
<div class=card><h2>Cerrar ciclo</h2><p class=mu>Resume las ventas por cliente en el historial y empieza el ciclo ${cy+1}. Los fiados pendientes pasan al ciclo nuevo.</p>

<button class=s onclick="addC()">+ Agregar</button>
${cart.map((x,i)=>`<div class=kv><span>${x.q}× ${esc(x.n)}</span><b>${$$(x.q*x.p)} <a onclick="cart.splice(${i},1);render()">✕</a></b></div>`).join('')}

// ====================== VISTA: FIADOS SIMPLE ======================
function vF(){
  const g={};Object.values(S.d).filter(d=>debe(d)>0).forEach(d=>{const x=g[d.client]=g[d.client]||{t:0,f:d.date,ph:d.phone,l:[]};x.t+=debe(d);if(d.date<x.f)x.f=d.date;x.ph=x.ph||d.phone;x.l.push(d)});
  let names=Object.keys(g).sort((a,b)=>g[b].t-g[a].t);

  return `<div class=card><h2>Quién me debe</h2><div class=kv><span>Total por cobrar</span><b class=big>${$$(T)}</b></div>
  <label>Buscar cliente</label>
  <div class=row>

  (names.map(n=>{const x=g[n],o=open===n;return `<div class="kv cl" onclick="open=${o?'null':JSON.stringify(n).replace(/"/g,'&quot;')};render()"><span>${esc(n)}<br><span class=mu>desde ${x.f}</span></span><span style="text-align:right"><b>${$$(x.t)}</b><br><a href="${waUrl(n)}" target="_blank" onclick="event.stopPropagation()">${WA} Cobrar</a></span></div>`+(o?`<div style="padding:6px 0">${x.l.map(d=>`<div class=mu>${d.date} · ${d.items.map(i=>i.q+'× '+esc(i.n)).join(', ')} · debe ${$$(debe(d))}</div>`).join('')}
<div class=row><div><label>Método</label><select id=pm><option>Efectivo</option><option>Daviplata</option></select></div><div><label>Monto a abonar</label><input id=pa type=number></div></div>
<div class=row><button class=r onclick="pagar(open,true)">Pagar todo (${$$(x.t)})</button><button class=s onclick="pagar(open,false)">Abonar</button></div>
<p><a href="${waUrl(n)}" target="_blank">${WA} Cobrar por WhatsApp (con el detalle)</a></p></div>`:'')}).join('')||'<p class=mu>Nadie te debe 🎉</p>')
}

// ====================== VISTA: STOCK ======================
function vS(){

  const psAll=ps;

  return `<div class=card><h2>Stock</h2>
<div class=kv><span>Valor del stock a precio de compra (costo)</span><b>${$$(psAll.reduce((a,p)=>a+Math.max(0,p.stock)*p.cost,0))}</b></div>
<div class=kv><span>Valor del stock a precio de venta</span><b>${$$(psAll.reduce((a,p)=>a+Math.max(0,p.stock)*p.price,0))}</b></div>
<label>Buscar producto</label>
<div class=row>
  <input id=busqSInput value="${esc(busqS)}" placeholder="Nombre..." list=plS>

</div>
<datalist id=plS>${psAll.map(p=>'<option>'+esc(p.name)+'</option>').join('')}</datalist>
${ps.map(stRow).join('')}
</div>
<div class=card><h2>Factura de compra</h2><label>Producto (nuevo o existente)</label><input id=cn list=pl oninput="chh()" autocomplete=off><datalist id=pl>${psAll.map(p=>'<option>'+esc(p.name)+'</option>').join('')}</datalist>
<p id=ch class=mu style="margin:4px 0"></p>
<div class=row><div><label>Cantidad</label><input id=cq type=number></div><div><label>Valor total pagado</label><input id=cv type=number></div></div>
<label>Precio de venta (obligatorio si es nuevo)</label><input id=cp type=number><button class=s onclick="addI()">+ Agregar a la factura</button>
${inv.map((x,i)=>`<div class=kv><span>${x.q}× ${esc(x.n)}<br><span class=mu>costo por unidad ${$$(x.v/x.q)}</span></span><b>${$$(x.v)} <a onclick="inv.splice(${i},1);render()">✕</a></b></div>`).join('')}
<div class=kv><span>Total de la factura</span><b class=big>${$$(inv.reduce((a,x)=>a+x.v,0))}</b></div>
<label>Pagar desde la caja</label><select id=cpm><option>No descontar</option><option>Efectivo</option><option>Daviplata</option></select><button class=r onclick="comprar()">Registrar compra</button>
<p class=mu>Compras registradas: ${cyf(S.pu).length} · ${$$(cyf(S.pu).reduce((a,x)=>a+x.total,0))}</p></div>
<div class=card><h2>Consumo personal</h2><label>Producto</label><select id=us>${Object.entries(S.p).map(([i,p])=>`<option value="${i}">${esc(p.name)} (${p.stock})</option>`).join('')}</select>
<label>Cantidad</label><input id=uq type=number value=1 min=1><button onclick="consumo()">Sacar del inventario</button>
<p class=mu>Sacado: ${cyf(S.u).reduce((a,x)=>a+x.q,0)} uds · inversión ${$$(cyf(S.u).reduce((a,x)=>a+x.q*x.cost,0))} · ganancia que dejaste de ganar ${$$(cyf(S.u).reduce((a,x)=>a+x.q*(x.price-x.cost),0))}</p></div>`}

// ====================== VISTA: CAJA ======================
function vC(){
  const e=bal('Efectivo'),d=bal('Daviplata'),T=e+d,G=gan(),X=gastos(),D=Math.max(0,Math.min(T,G-X));
  return `<div class=card><h2>Caja</h2><div class=kv><span>Efectivo</span><b>${$$(e)}</b></div><div class=kv><span>Daviplata</span><b>${$$(d)}</b></div><div class=kv><span>Total en caja</span><b class=big>${$$(T)}</b></div>
<h3>¿Cuánto es ganancia?</h3><div class=kv><span>Ganancia cobrada</span><b>${$$(G)}</b></div><div class=kv><span>Gastos y retiros</span><b>${$$(X)}</b></div><div class=kv><span>Ganancia disponible</span><b class=ok>${$$(D)}</b></div><div class=kv><span>Para reinvertir</span><b>${$$(T-D)}</b></div></div>
<div class=card><h2>Caja menor</h2><label>Tipo</label><select id=mt>${opts(['Gasto','Reinversion','Retiro personal','Traslado','Ingreso extra'])}</select><label>Método</label><select id=mm>${opts(['Efectivo','Daviplata'])}</select>
<label>Monto</label><input id=ma type=number><label>Nota</label><input id=mn><button onclick="mov()">Registrar movimiento</button></div>
<div class=card><h2>Saldo inicial</h2><div class=row><div><label>Efectivo</label><input id=se type=number value="${S.cfg.efi}"></div><div><label>Daviplata</label><input id=sd type=number value="${S.cfg.dvi}"></div></div><button class=s onclick="saldo()">Guardar saldo inicial</button><button class=s onclick="respaldo()">Descargar respaldo (CSV)</button></div>`}

// ====================== RENDER PRINCIPAL ======================
function render(){
  const a=document.activeElement&&document.activeElement.id,v=a&&document.activeElement.value;
  $('#nv').innerHTML=menuList().map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';go()">${esc(l)}</button>`).join('')+(TH.logo?`<img src="${TH.logo}" alt="" style="display:block;width:calc(100% - 24px);margin:14px 12px;border-radius:12px">`:'');
  $('#sec').textContent='· '+LB(tab);
  $('#m').innerHTML={i:vD,v:vV2,n:vVn3,f:vF2,k:vCl,s:vSt,q:vQ,c:vCj,r:vR,z:vZ3}[tab]();
  if(tab==='v')pp();

}

// ====================== API PÚBLICA (window.M) ======================
window.M = { render, vD, vV2, vVn3, vF2, vCl, vSt, vQ, vCj, vR, vZ3, menu, go, vender, pagar, addI, comprar, consumo, mov, saldo, respaldo, exportar, leer, importar, th, saveCl, saveP, delP, delCl, saveDm, editMn, savMn, cerrar, anularCierre, addC, cancelV, anular, ajustar, cambio, devolver, dr, savC, canC, edit, logo, bgimg, chh, chh2, fillPh, pp, pagar2, copiar, setTab: (t) => { tab = t; go(); }, setSub: (s) => { sub = s; render(); }, setSc: (s) => { sc = s; render(); }, setCf2: (s) => { cf2 = s; render(); }, setTipo: (t) => { tipo = t; render(); }, limpiarF: () => { fVd=''; fVh=''; fVcli=''; render(); } };

// ====================== FIREBASE ======================
const firebaseConfig = { apiKey: "AIzaSyD4eEHntHzjs6SPjPf2Djaka7vAnvrgYPo", authDomain: "malan-snacks.firebaseapp.com", projectId: "malan-snacks", storageBucket: "malan-snacks.firebasestorage.app", messagingSenderId: "930913775226", appId: "1:930913775226:web:bb1b1a4f7bc2de33be15c3" };
firebase.initializeApp(firebaseConfig);
db = firebase.firestore();
const auth = firebase.auth();

// ====================== LOGIN ======================
window.doLoginBtn = async function(){
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  try {
    await auth.signInWithEmailAndPassword(email, pass);
    // Guarda el momento exacto del login → de aquí cuentan las 2 horas
    localStorage.setItem('malan_login_ts', Date.now().toString());
    logLogin(email);
  }
  catch (e) {
    const err = document.getElementById('loginError');
    if(err) { err.textContent = "Correo o contraseña incorrectos"; err.style.display = 'block'; }
  }
};
// ============ EXPIRACIÓN DE SESIÓN (2 horas) ============
const SESSION_MS = 2 * 60 * 60 * 1000; // 2h en milisegundos

function checkSession(){
  if(!auth.currentUser) return;
  const ts = +localStorage.getItem('malan_login_ts') || 0;
  if(!ts) return;
  if(Date.now() - ts > SESSION_MS){
    alert('Tu sesión expiró después de 2 horas. Inicia sesión de nuevo.');
    unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];inited=false;
    localStorage.removeItem('malan_login_ts');
    auth.signOut();
  }
}

// Arranca el chequeo cada minuto (solo una vez)
function startSessionWatch(){
  if(window._sessionTimer) return;
  window._sessionTimer = setInterval(checkSession, 60000);
}

// ====================== LOGOUT ======================
window.logoutApp = function(){
  if(!confirm('¿Cerrar sesión?')) return;
  unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];inited=false;
  localStorage.removeItem('malan_login_ts');
  auth.signOut();
};

// ====================== MOSTRAR / OCULTAR UI SEGÚN SESIÓN ======================
function setUI(show){
  const st=$('#st'),lo=$('#lo');
  if(st)st.style.display=show?'inline':'none';
  if(lo)lo.style.display=show?'inline-block':'none';
}

// ====================== AUTH STATE ======================
auth.onAuthStateChanged(user => {
  const ls = document.getElementById('loginScreen');
  if (user) {
  loggedIn = true;
  setUI(true);
  checkSession();          // ← revisa al cargar
  startSessionWatch();     // ← arranca el timer
  if(ls) ls.style.display = 'none';
  document.getElementById('m').innerHTML = '';
  initApp();
}
  } else {
    loggedIn = false;
    setUI(false);
    unsubs.forEach(u=>{try{u()}catch(_){}});unsubs=[];inited=false;
    if(ls) ls.style.display = 'block';
    document.getElementById('nv').innerHTML = '';
    document.getElementById('m').innerHTML = `<div id="loginScreen" class="card" style="max-width:400px;margin:40px auto;text-align:center;"><h2 style="color:var(--ac);margin-bottom:20px;">🔐 Iniciar Sesión</h2><label style="text-align:left;">Correo electrónico</label><input id="loginEmail" type="email" placeholder="tu@correo.com" style="margin-bottom:12px;"><label style="text-align:left;">Contraseña</label><input id="loginPass" type="password" placeholder="••••••••" style="margin-bottom:12px;"><button class="r" onclick="doLoginBtn()" style="width:100%;padding:12px;">Entrar</button><p id="loginError" class="bad" style="margin-top:10px;display:none;"></p></div>`;
  }
});

// ====================== INIT APP ======================
function initApp() {
  if(inited) return;
  inited = true;
  window.addEventListener('online',status);window.addEventListener('offline',status);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  if(db) db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  [['products','p'],['debts','d'],['cash','c'],['sales','s'],['clients','cl'],['uses','u'],['purchases','pu'],['hist','h'],['cycles','cs'],['adj','adj'],['closed','ck']].forEach(([c,k])=>{
    const u = db.collection(c).onSnapshot(sn => {
      S[k]={}; sn.docs.forEach(d=>S[k][d.id]=d.data());
      if(!['INPUT','SELECT'].includes(document.activeElement.tagName)) render();
    });
    unsubs.push(u);
  });
  const u1 = db.collection('config').doc('main').onSnapshot(sn => { if(sn.exists)S.cfg=Object.assign({efi:0,dvi:0,tk:0,cy:1},sn.data()); if(!['INPUT','SELECT'].includes(document.activeElement.tagName)) render(); });
  const u2 = db.collection('config').doc('theme').onSnapshot(sn => { TH=sn.exists?sn.data():{}; applyTh(); if(!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) render(); });
  const u3 = db.collection('config').doc('backup').onSnapshot(sn => { BK=sn.exists?sn.data():null; if(!['INPUT','SELECT'].includes(document.activeElement.tagName)) render(); });
  unsubs.push(u1,u2,u3);
  render();
}
</script>
