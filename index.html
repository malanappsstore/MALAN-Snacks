<script type="module">
// ==========================================
// SECCIÓN 1: CONEXIÓN A FIREBASE
// ==========================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD4eEHntHzjs6SPjPf2Djaka7vAnvrgYPo",
  authDomain: "malan-snacks.firebaseapp.com",
  projectId: "malan-snacks",
  storageBucket: "malan-snacks.firebasestorage.app",
  messagingSenderId: "930913775226",
  appId: "1:930913775226:web:bb1b1a4f7bc2de33be15c3",
  measurementId: "G-KWKLW2C2NV"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// ==========================================
// SECCIÓN 2: VARIABLES Y ESTADO GLOBAL
// ==========================================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

let S={p:{},d:{},c:{},s:{},cl:{},u:{},pu:{},h:{},cs:{},adj:{},ck:{},cfg:{efi:0,dvi:0,tk:0,cy:1}};
let TH={}, tab='i', cart=[], inv=[], open=null, pend=false, tipo='Contado', cf=false, cf2='apa', sc='res', sub='inv', av=null, sel=null, ri=null, eC=null, DR={}, ec=null, dc=null, eP=null, dpd=null, fcl=null, fm=null, dmo=false, BK=null, imp=null, imt='', ci=false, cu=false, sq=false;
let busqV='', busqF='', busqC='', busqS='', busqAj='', fVd='', fVh='', fVcli='';
let vf={cli:'',ph:'',met:'Efectivo',ab:'',abwho:'1'};

const cyf=o=>Object.values(o).filter(x=>(x.cy||1)===S.cfg.cy);
const TABS=[['i','Inicio'],['v','Vender'],['n','Ventas'],['f','Fiados'],['k','Clientes'],['s','Stock'],['q','Catálogo'],['c','Saldo y Movimientos'],['r','Ciclo'],['z','Configuración']];
const SUBS=[['inv','Inventario'],['com','Compras'],['aju','Cambio'],['agq','Ajuste inv.'],['his','Historial Compras']];
const SUBC=[['res','Saldo y movimientos'],['mov','Resumen de movimientos']];
const SUBZ=[['apa','Apariencia'],['cob','W.APP Cobros'],['mnu','Menú'],['res','Respaldos']];
const NM={products:'productos',debts:'fiados',sales:'ventas',cash:'movimientos de caja',clients:'clientes',uses:'consumos',purchases:'compras',hist:'historial',cycles:'ciclos',adj:'ajustes'};
const cnts=o=>Object.keys(NM).map(k=>NM[k]+' '+Object.keys((o&&o[k])||{}).length).join(' · ');

// ==========================================
// SECCIÓN 3: FUNCIONES NÚCLEO Y CÁLCULOS
// ==========================================
function save(coll,id,data,m){const r=doc(db,coll,id);(m==='u'?updateDoc(r,data):setDoc(r,data)).catch(e=>console.log('Error al guardar:', e))}
function add(coll,data){addDoc(collection(db,coll),data).catch(e=>console.log('Error al agregar:', e))}
function del(coll,id){deleteDoc(doc(db,coll,id)).catch(e=>console.log('Error al borrar:', e))}
function flash(t){const s=$('#st');s.textContent=t;setTimeout(status,3500)}
function status(){const s=$('#st');s.textContent=(navigator.onLine?'en línea':'sin conexión')+(pend?' · cambios pendientes':'')}
function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

function tot(it){return it.reduce((a,x)=>a+x.q*x.p,0)} 
function cst(it){return it.reduce((a,x)=>a+x.q*x.c,0)}
function debe(d){return Math.max(0,d.total-(d.paid||0))}
function bal(m){return (m==='Efectivo'?S.cfg.efi:S.cfg.dvi)+cyf(S.c).filter(x=>x.method===m).reduce((a,x)=>a+(x.in||0)-(x.out||0),0)}
const gd=(d,p)=>{let g=0,r=p;d.items.forEach(i=>{const t=i.q*i.p,c=i.q*i.c,x=Math.min(t,Math.max(0,r));r-=x;g+=Math.max(0,Math.min(t-c,x-c))});return g};
function gan(){let g=0;Object.values(S.s).forEach(s=>g+=s.total-s.cost);ND().forEach(d=>g+=gd(d,d.paid||0)-gd(d,d.paid0||0));return g}
function gastos(){return cyf(S.c).filter(x=>x.concept==='Gasto'||x.concept==='Retiro personal').reduce((a,x)=>a+(x.out||0),0)}
function kp(){const sv=Object.values(S.s),dl=ND(),sT=sv.reduce((a,s)=>a+s.total,0);return{base:Object.values(S.p).reduce((a,p)=>a+Math.max(0,p.stock)*p.cost,0),vend:sT+dl.reduce((a,d)=>a+d.total,0),cob:sT+dl.reduce((a,d)=>a+(d.paid||0)-(d.paid0||0),0),pc:Object.values(S.d).reduce((a,d)=>a+debe(d),0),gan:sv.reduce((a,s)=>a+s.total-s.cost,0)+dl.reduce((a,d)=>a+d.total-d.cost,0),gcob:gan(),comp:cyf(S.pu).reduce((a,x)=>a+x.total,0),cons:cyf(S.u).reduce((a,x)=>a+x.q*x.cost,0)}}
function kx(){const k=kp(),sv=Object.values(S.s),dl=ND(),sold={};[...sv,...dl].forEach(s=>s.items.forEach(i=>sold[i.n]=(sold[i.n]||0)+i.q));cyf(S.u).forEach(u=>sold[u.name]=(sold[u.name]||0)+u.q);const base=Object.values(S.p).reduce((a,p)=>a+(Math.max(0,p.stock)+(sold[p.name]||0))*p.cost,0),cv=sv.reduce((a,s)=>a+s.cost,0)+dl.reduce((a,d)=>a+d.cost,0),rec=k.cob-k.gcob;return Object.assign(k,{baseC:base,rec,porRec:Math.max(0,cv-rec),pctRec:base>0?rec/base:0,cont:sv.reduce((a,s)=>a+s.total,0),fio:dl.reduce((a,d)=>a+d.total,0),pend:k.gan-k.gcob,pct:cv>0?k.gan/cv:0})}
const ND=()=>Object.values(S.d).filter(d=>!d.money);
const fp=n=>Object.entries(S.p).find(([i,p])=>p.name.toLowerCase()===n.toLowerCase());
function cash(concept,detail,method,inn,out){if(inn||out)add('cash',{ts:Date.now(),date:today(),cy:S.cfg.cy,concept,detail,method,in:inn||0,out:out||0})}
function nextTk(){const t=Math.max(S.cfg.tk||0,...Object.values(S.d).map(d=>d.ticket||0),...Object.values(S.s).map(d=>d.ticket||0))+1;save('config','main',{tk:t},'u');return t}
function upClient(name,phone){const k=Object.entries(S.cl).find(([i,c])=>c.name.toLowerCase()===name.toLowerCase());if(k){const c=k[1];c.veces=(c.veces||0)+1;save('clients',k[0],{phone:phone||c.phone||'',veces:c.veces},'u')}else save('clients',nid(),{name,phone:phone||'',area:'',veces:1,pagos:0,dias:0})}
function cp(cl,d){const k=Object.entries(S.cl).find(([i,c])=>c.name.toLowerCase()===cl.toLowerCase());if(!k)return;const c=k[1],dias=Math.max(0,Math.round((Date.now()-new Date(d.date+'T00:00:00'))/864e5));c.pagos=(c.pagos||0)+1;c.dias=(c.dias||0)+dias;save('clients',k[0],{pagos:c.pagos,dias:c.dias},'u')}
function setStock(id,v){S.p[id].stock=v;save('products',id,{stock:v},'u')}
// ==========================================
// SECCIÓN 4: VENTAS, FIADOS Y ANULACIONES
// ==========================================
function vender(){
  const g=id=>$(id).value;
  if(!cart.length)return flash('Agrega productos');
  const met=g('#met'),cli=g('#cli').trim(),ph=g('#ph').trim();
  if(tipo==='Fiado'&&!cli)return flash('Escribe el cliente');
  if(tipo==='Fiado'&&cli&&(vf.c2||'').trim().toLowerCase()===cli.toLowerCase())return flash('El otro cliente debe ser distinto');
  if(tipo==='Fiado'&&(vf.c2||'').trim()){const a1=+vf.pc||0;if(!(a1>0)||a1>=tot(cart))return flash('Escribe cuánto paga el primer cliente (menos que el total)')}
  for(const it of cart){const p=S.p[it.id];if(p.stock<it.q&&!confirm('Solo quedan '+p.stock+' de '+p.name+'. ¿Seguir?'))return}
  
  const items=cart.map(x=>({n:x.n,q:x.q,p:x.p,c:x.c})),T=tot(items),C=cst(items),tk=nextTk();
  cart.forEach(it=>setStock(it.id,S.p[it.id].stock-it.q));
  
  if(tipo==='Contado'){
    save('sales',nid(),{date:today(),client:cli||'Ocasional',items,total:T,cost:C,method:met,ticket:tk});
    cash('Venta contado',cli||'Ocasional',met,T,0);
    if(cli)addCl(cli,ph)
  } else {
    const c2=(vf.c2||'').trim(),pc=1-Math.min(T,Math.max(0,+vf.pc||0))/T,sc=k=>items.map(x=>({...x,p:x.p*k,c:x.c*k}));
    if(c2){
      const ab=Math.min(T*(1-pc),+g('#ab')||0), k2=Object.values(S.cl).find(c=>c.name.toLowerCase()===c2.toLowerCase());
      let p1=0, p2=0;
      if(vf.abwho==='1') { p1=ab; }
      else if(vf.abwho==='2') { p2=ab; }
      else { p1=ab/2; p2=ab/2; }
      save('debts',nid(),{date:today(),client:cli,phone:ph,items:sc(1-pc),total:T*(1-pc),cost:C*(1-pc),paid:p1,ticket:tk,con:c2});
      save('debts',nid(),{date:today(),client:c2,phone:(k2&&k2.phone)||'',items:sc(pc),total:T*pc,cost:C*pc,paid:p2,ticket:tk,con:cli});
      if(ab)cash('Abono inicial de fiado',cli+' y '+c2,met,ab,0);
      upClient(cli,ph);upClient(c2,'')
    } else {
      const ab=Math.min(T,+g('#ab')||0);
      save('debts',nid(),{date:today(),client:cli,phone:ph,items,total:T,cost:C,paid:ab,ticket:tk});
      if(ab)cash('Abono inicial de fiado',cli,met,ab,0);
      upClient(cli,ph)
    }
  }
  cart=[];vf={cli:'',ph:'',met:'Efectivo',ab:'',abwho:'1'};flash('Venta registrada ✓');render()
}
function pagar(cl,all){
  const met=$('#pm').value;let amt=all?Infinity:+$('#pa').value||0;if(!amt)return flash('Escribe el monto');
  const ds=Object.entries(S.d).filter(([i,d])=>d.client===cl&&debe(d)>0).sort((a,b)=>a[1].date<b[1].date?-1:1);let sum=0;
  for(const[i,d]of ds){if(amt<=0)break;const x=Math.min(amt,debe(d));d.paid=(d.paid||0)+x;save('debts',i,{paid:d.paid},'u');amt-=x;sum+=x;if(debe(d)<=0)cp(cl,d)}
  cash(all?'Pago de fiado':'Abono de fiado',cl,met,sum,0);flash('Registrado '+$$(sum));render()
}
function anular(k,i){
  if(av!==i){av=i;return render()}
  av=null;const m=($('#am')||{}).value||'Efectivo',s=(k==='s'?S.s:S.d)[i];if(!s)return;const pr=k==='d'&&s.con?Object.entries(S.d).find(([j,d])=>j!==i&&d.ticket===s.ticket&&d.client===s.con):null;
  s.items.forEach(it=>{const e=fp(it.n);if(e)setStock(e[0],e[1].stock+it.q)});
  const dev=k==='s'?s.total:(s.paid||0)+(pr?(pr[1].paid||0):0);
  if(dev>0)cash('Anulación de venta',(s.client||'Ocasional')+' #'+s.ticket,k==='s'?s.method:m,0,dev);
  add('adj',{ts:Date.now(),date:today(),cy:S.cfg.cy,name:'Anulación #'+s.ticket,q:0,reason:'Anulación',note:(s.client||'Ocasional')+' · '+$$(s.total)});
  if(pr)del('debts',pr[0]);del(k==='s'?'sales':'debts',i);flash('Venta anulada ✓');render()
}
function devolver(k,i,j){
  const s=(k==='s'?S.s:S.d)[i];if(!s)return;if(s.con)return flash('En una cuenta compartida usa Anular venta completa');
  const it=s.items[j],q=Math.min(it.q,Math.max(0,+$('#rq').value||0)),vuelve=$('#rs').value==='1',m=$('#rm').value;
  if(!(q>0))return flash('Escribe la cantidad a devolver');
  const val=q*it.p,cst=q*it.c,items=s.items.map((x,n)=>n===j?{...x,q:x.q-q}:x).filter(x=>x.q>0);
  if(!items.length)return flash('Es toda la venta: usa Anular venta completa');
  const total=s.total-val,cost=Math.max(0,s.cost-cst);
  if(vuelve){const e=fp(it.n);if(e)setStock(e[0],e[1].stock+q)}
  if(k==='s'){save('sales',i,{items,total,cost},'u');cash('Devolución',(s.client||'Ocasional')+' #'+s.ticket,s.method,0,val)}
  else{const paid=s.paid||0,dev=Math.max(0,paid-total);save('debts',i,{items,total,cost,paid:Math.min(paid,total)},'u');if(dev>0)cash('Devolución',s.client+' #'+s.ticket,m,0,dev)}
  add('adj',{ts:Date.now(),date:today(),cy:S.cfg.cy,name:'Devolución #'+s.ticket+' · '+it.n,q:vuelve?q:0,reason:vuelve?'Devolución':'Devolución (no vuelve: vencido o dañado)',note:q+'× '+it.n+' · '+$$(val)});
  ri=null;flash('Devolución registrada ✓');render()
}

// ==========================================
// SECCIÓN 5: COMPRAS, INVENTARIO Y CAJA
// ==========================================
function addI(){
  const n=$('#cn').value.trim(),q=+$('#cq').value,v=+$('#cv').value,pr=+$('#cp').value;
  if(!n||!(q>0)||!(v>=0))return flash('Completa producto, cantidad y valor');
  if(!fp(n)&&!inv.some(x=>x.n.toLowerCase()===n.toLowerCase())&&!(pr>0))return flash('Producto nuevo: escribe el precio');
  if(inv.length>=10)return flash('Máximo 10 ítems por factura');
  inv.push({n,q,v,pr});render()
}
function comprar(){
  if(!inv.length)return flash('Agrega ítems a la factura');
  const T=inv.reduce((a,x)=>a+x.v,0);
  inv.forEach(x=>{const e=fp(x.n);
    if(e){const p=e[1],st=Math.max(0,p.stock);p.stock+=x.q;p.cost=Math.round((st*p.cost+x.v)/(st+x.q)*10000)/10000;if(x.pr>0)p.price=x.pr;p.lc=Math.round(x.v/x.q*100)/100;p.ld=today();save('products',e[0],{stock:p.stock,cost:p.cost,price:p.price,lc:p.lc,ld:p.ld},'u')}
    else{const id=nid();S.p[id]={name:x.n,stock:x.q,cost:x.v/x.q,price:x.pr,lc:Math.round(x.v/x.q*100)/100,ld:today()};save('products',id,S.p[id])}});
  add('purchases',{ts:Date.now(),date:today(),cy:S.cfg.cy,total:T,items:inv.length,det:inv.map(x=>({n:x.n,q:x.q,v:x.v}))});
  const pm=$('#cpm').value;if(pm!=='No descontar')cash('Reinversion','Compra de mercancia ('+inv.length+' items)',pm,0,T);
  inv=[];flash('Compra registrada ✓');render()
}
function consumo(){
  const id=$('#us').value,q=+$('#uq').value,p=S.p[id];
  if(!p||!(q>0))return flash('Elige producto y cantidad');
  if(p.stock<q&&!confirm('Solo quedan '+p.stock+'. ¿Seguir?'))return;
  setStock(id,p.stock-q);add('uses',{ts:Date.now(),date:today(),cy:S.cfg.cy,name:p.name,q,cost:p.cost,price:p.price});flash('Consumo registrado ✓');render()
}
function cambio(){
  const na=$('#ci').value.trim(),nb=$('#co').value.trim(),q=+$('#cc').value;
  const ea=fp(na), eb=fp(nb);
  if(!ea||!eb||ea[0]===eb[0]||!(q>0))return flash('Elige dos productos distintos y la cantidad');
  if(eb[1].stock<q)return flash('Solo hay '+eb[1].stock+' de '+eb[1].name);
  setStock(ea[0],ea[1].stock+q);setStock(eb[0],eb[1].stock-q);
  add('adj',{ts:Date.now(),date:today(),cy:S.cfg.cy,name:ea[1].name+' → '+eb[1].name,q,reason:'Cambio de producto',note:''});flash('Cambio registrado ✓');render()
}
function ajustar(sg){
  const na=$('#aj').value.trim(),q=+$('#aq').value;
  const ea=fp(na);
  if(!ea||!(q>0))return flash('Elige producto y cantidad');
  const id=ea[0],p=ea[1];
  if(sg<0&&p.stock<q)return flash('Solo hay '+p.stock+' en inventario');

window.doLoginBtn = async function(){
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch (e) { 
    const err = document.getElementById('loginError');
    err.textContent = "Correo o contraseña incorrectos";
    err.style.display = 'block';

  render();
}
